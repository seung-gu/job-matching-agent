<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10/20 회의 안건</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f1f1f;
    --muted: #666660;
    --line: #e2e2dc;
    --soft: #f6f6f3;
    --accent: #2f6fd6;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 16px 0;
  }
  .title { font-weight: 700; font-size: 16px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav a {
    padding: 8px 12px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav a.active { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 64px; }
  h1 { font-size: 26px; margin: 20px 0 8px; }
  h2 { font-size: 21px; margin: 36px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 17px; margin: 26px 0 8px; }
  h4 { font-size: 15px; margin: 20px 0 6px; }
  a { color: var(--accent); }
  code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; min-width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--soft); }
  main img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 8px 0 20px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .error {
    padding: 12px 16px;
    border: 1px solid #f0a800;
    background: #fff4dc;
    border-radius: 8px;
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">10/20 회의 안건</div>
    <nav id="tabs"></nav>
  </div>
</header>
<main id="content"></main>
<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";

  // 탭 = 같은 폴더의 md 파일. 순서를 바꾸거나 페이지를 추가하려면 여기만 고침.
  const PAGES = [
    { id: "main", label: "메인", file: "README.md" },
    { id: "BE", label: "BE", file: "BE.md" },
    { id: "LLM", label: "LLM", file: "LLM.md" },
    { id: "FE", label: "FE", file: "FE.md" },
    { id: "DevOps", label: "DevOps", file: "DevOps.md" },
    { id: "Test", label: "Test", file: "Test.md" },
  ];

  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  marked.use({
    renderer: {
      table(header, body) {
        return `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
      },
    },
  });

  const tabs = document.getElementById("tabs");
  const content = document.getElementById("content");
  for (const p of PAGES) {
    const a = document.createElement("a");
    a.href = `#${p.id}`;
    a.textContent = p.label;
    a.dataset.id = p.id;
    tabs.appendChild(a);
  }

  async function show(id) {
    const page = PAGES.find((p) => p.id === id) || PAGES[0];
    for (const a of tabs.children) a.classList.toggle("active", a.dataset.id === page.id);
    let md;
    try {
      const res = await fetch(page.file, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${res.status}`);
      md = await res.text();
    } catch (e) {
      content.innerHTML = `<p class="error">${page.file}을 읽지 못했습니다 (${escapeHtml(String(e.message || e))}).<br>
        파일을 더블클릭으로 열면 브라우저가 md 파일을 막습니다. 이 폴더에서 <code>python3 -m http.server</code>를 실행하고
        <code>http://localhost:8000</code>으로 열어 주세요.</p>`;
      return;
    }
    content.innerHTML = marked.parse(md);
    // md 맨 위의 페이지 링크 줄은 위 탭과 같아서 숨김
    const first = content.querySelector("h1 + p");
    const links = first ? [...first.querySelectorAll("a")] : [];
    if (links.length && links.every((a) => (a.getAttribute("href") || "").endsWith(".md"))) first.remove();
    window.scrollTo(0, 0);
  }

  // md 안의 다른 md 링크(예: BE.md)는 탭 전환으로 바꿈
  content.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    const href = a.getAttribute("href") || "";
    const page = PAGES.find((p) => href === p.file || href.startsWith(`${p.file}#`));
    if (page) {
      e.preventDefault();
      location.hash = page.id;
    }
  });

  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
