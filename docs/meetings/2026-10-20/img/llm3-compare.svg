<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 290" role="img" aria-label="같은 평가 셋으로 구현 3개를 돌려 점수를 비교함" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="cmp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">같은 평가 셋으로 구현 3개를 돌려 점수를 비교함</text>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M176 170H205" marker-end="url(#cmp-arrow)"/>
    <path d="M335 170H360" marker-end="url(#cmp-arrow)"/>
    <path d="M348 170V100H360" marker-end="url(#cmp-arrow)"/>
    <path d="M348 170V240H360" marker-end="url(#cmp-arrow)"/>
    <path d="M540 100H558V170H575" marker-end="url(#cmp-arrow)"/>
    <path d="M540 170H575" marker-end="url(#cmp-arrow)"/>
    <path d="M540 240H558V170"/>
  </g>
  <g id="eval-set">
    <rect x="24" y="142" width="152" height="56" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="100" y="166" text-anchor="middle" font-weight="600" fill="#141413">평가 셋</text>
    <text x="100" y="184" text-anchor="middle" font-size="11.5" fill="#52514e">공고 약 30개 + 정답</text>
  </g>
  <g id="port">
    <rect x="205" y="142" width="130" height="56" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="270" y="166" text-anchor="middle" font-weight="600" fill="#141413">포트</text>
    <text x="270" y="184" text-anchor="middle" font-size="11.5" fill="#52514e">match()</text>
  </g>
  <g id="impl-plain">
    <rect x="360" y="74" width="180" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="450" y="96" text-anchor="middle" font-weight="600" fill="#141413">직접 구현</text>
    <text x="450" y="114" text-anchor="middle" font-size="11.5" fill="#52514e">프레임워크 없이 SDK + 코드</text>
  </g>
  <g id="impl-pydantic">
    <rect x="360" y="144" width="180" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="450" y="166" text-anchor="middle" font-weight="600" fill="#141413">pydantic-ai</text>
    <text x="450" y="184" text-anchor="middle" font-size="11.5" fill="#52514e">타입 기반 agent</text>
  </g>
  <g id="impl-langgraph">
    <rect x="360" y="214" width="180" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="450" y="236" text-anchor="middle" font-weight="600" fill="#141413">LangGraph</text>
    <text x="450" y="254" text-anchor="middle" font-size="11.5" fill="#52514e">그래프 워크플로</text>
  </g>
  <g id="score">
    <rect x="575" y="142" width="150" height="56" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="650" y="166" text-anchor="middle" font-weight="600" fill="#141413">점수 비교</text>
    <text x="650" y="184" text-anchor="middle" font-size="11.5" fill="#52514e">매칭 결과 vs 정답</text>
  </g>
</svg>
