<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 340" role="img" aria-label="MCP를 두면 도구가 별도 서버, 안 두면 Python 함수를 바로 도구로 씀" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="mcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">MCP를 두면 도구가 별도 서버, 안 두면 Python 함수를 바로 도구로 씀</text>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M116 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M278 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M196 208V238" marker-end="url(#mcp-arrow)"/>
    <path d="M564 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M564 208V238" marker-end="url(#mcp-arrow)"/>
  </g>
  <g id="panel-with">
    <rect x="24" y="48" width="344" height="272" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="40" y="66" font-weight="600" fill="#141413">MCP를 둘 때</text>
  </g>
  <g id="with-agent">
    <rect x="41" y="76" width="150" height="40" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="116" y="100" text-anchor="middle" font-size="12.5" fill="#141413">pydantic-ai agent</text>
  </g>
  <g id="with-client">
    <rect x="208" y="76" width="140" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="278" y="100" text-anchor="middle" font-size="12.5" fill="#141413">다른 MCP 클라이언트</text>
  </g>
  <g id="with-mcp">
    <rect x="46" y="150" width="300" height="58" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="196" y="175" text-anchor="middle" font-weight="600" fill="#141413">MCP 서버</text>
    <text x="196" y="193" text-anchor="middle" font-size="11.5" fill="#52514e">도구 정의 · 별도 프로세스</text>
  </g>
  <g id="with-ext">
    <rect x="46" y="238" width="300" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="196" y="262" text-anchor="middle" fill="#141413">공고 사이트 · API · DB</text>
  </g>
  <text x="196" y="302" text-anchor="middle" font-size="11.5" fill="#52514e">Claude Desktop 등 다른 클라이언트도 같은 도구를 씀</text>
  <g id="panel-without">
    <rect x="392" y="48" width="344" height="272" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="408" y="66" font-weight="600" fill="#141413">MCP 없이</text>
  </g>
  <g id="without-agent">
    <rect x="489" y="76" width="150" height="40" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="564" y="100" text-anchor="middle" font-size="12.5" fill="#141413">pydantic-ai agent</text>
  </g>
  <g id="without-tools">
    <rect x="414" y="150" width="300" height="58" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="564" y="175" text-anchor="middle" font-weight="600" fill="#141413">도구 함수</text>
    <text x="564" y="193" text-anchor="middle" font-size="11.5" fill="#52514e">Python 함수를 agent에 바로 등록</text>
  </g>
  <g id="without-ext">
    <rect x="414" y="238" width="300" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="564" y="262" text-anchor="middle" fill="#141413">공고 사이트 · API · DB</text>
  </g>
  <text x="564" y="302" text-anchor="middle" font-size="11.5" fill="#52514e">프로세스 하나 · 필요하면 같은 함수 위에 MCP를 얹음</text>
</svg>
