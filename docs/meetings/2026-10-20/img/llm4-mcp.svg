    <text x="452" y="100" text-anchor="middle" font-size="12.5" fill="#141413">직접 구현</text>
    <text x="564" y="100" text-anchor="middle" font-size="12.5" fill="#141413">pydantic-ai</text>
    <text x="676" y="100" text-anchor="middle" font-size="12.5" fill="#141413">LangGraph</text>
  </g>
  <g id="without-wrappers">
