<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 340" role="img" aria-label="MCP를 두면 도구 정의가 한 곳, 안 두면 구현마다 래퍼가 생김" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="mcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">MCP를 두면 도구 정의가 한 곳, 안 두면 구현마다 래퍼가 생김</text>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M84 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M196 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M308 116V150" marker-end="url(#mcp-arrow)"/>
    <path d="M196 208V238" marker-end="url(#mcp-arrow)"/>
    <path d="M452 116V130" marker-end="url(#mcp-arrow)"/>
    <path d="M564 116V130" marker-end="url(#mcp-arrow)"/>
    <path d="M676 116V130" marker-end="url(#mcp-arrow)"/>
    <path d="M452 170V184" marker-end="url(#mcp-arrow)"/>
    <path d="M564 170V184" marker-end="url(#mcp-arrow)"/>
    <path d="M676 170V184" marker-end="url(#mcp-arrow)"/>
    <path d="M564 224V238" marker-end="url(#mcp-arrow)"/>
  </g>
  <g id="panel-with">
    <rect x="24" y="48" width="344" height="272" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="40" y="66" font-weight="600" fill="#141413">MCP를 둘 때</text>
  </g>
  <g id="with-impls">
    <rect x="34" y="76" width="100" height="40" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <rect x="146" y="76" width="100" height="40" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <rect x="258" y="76" width="100" height="40" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="84" y="100" text-anchor="middle" font-size="12.5" fill="#141413">직접 구현</text>
    <text x="196" y="100" text-anchor="middle" font-size="12.5" fill="#141413">pydantic-ai</text>
    <text x="308" y="100" text-anchor="middle" font-size="12.5" fill="#141413">LangGraph</text>
  </g>
  <g id="with-mcp">
    <rect x="46" y="150" width="300" height="58" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="196" y="175" text-anchor="middle" font-weight="600" fill="#141413">MCP 서버</text>
    <text x="196" y="193" text-anchor="middle" font-size="11.5" fill="#52514e">도구 정의 한 곳 (예: 공고 조회 · 이력 검색)</text>
  </g>
  <g id="with-ext">
