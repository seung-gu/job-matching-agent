    <text x="196" y="262" text-anchor="middle" fill="#141413">공고 사이트 · API · DB</text>
  </g>
  <text x="196" y="302" text-anchor="middle" font-size="11.5" fill="#52514e">도구 정의 1벌, 모든 구현이 같은 도구를 씀</text>
  <g id="panel-without">
