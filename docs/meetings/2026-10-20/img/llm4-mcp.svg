    <text x="564" y="154" text-anchor="middle" font-size="12.5" fill="#141413">도구 래퍼</text>
    <text x="676" y="154" text-anchor="middle" font-size="12.5" fill="#141413">도구 래퍼</text>
  </g>
  <g id="without-shared">
    <rect x="414" y="184" width="300" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="564" y="208" text-anchor="middle" fill="#141413">공통 Python 함수 (도구 로직)</text>
  </g>
  <g id="without-ext">
    <rect x="414" y="238" width="300" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="564" y="262" text-anchor="middle" fill="#141413">공고 사이트 · API · DB</text>
  </g>
  <text x="564" y="302" text-anchor="middle" font-size="11.5" fill="#52514e">래퍼가 구현마다 1벌, 도구 설명이 어긋날 수 있음</text>
</svg>
